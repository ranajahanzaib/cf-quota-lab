# yaml-language-server: $schema=../../schemas/config.schema.json
# Disposable local fixture; traffic weights affect projections, not sample counts.
version: 1
project:
  name: budget-violations
target:
  url: http://127.0.0.1:8787
  mode: local
profile:
  name: workers-free
workload:
  seed: 42
  concurrency: 3
  requests_per_scenario: 10
  timeout_ms: 5000
  warmup_requests: 0
  scenarios:
    - name: search-user
      weight: 60
      request:
        method: GET
        path: /api/users?email=user1999%40example.test
      expect:
        status: 200
        json_contains:
          ok: true
    - name: get-user
      weight: 39
      request:
        method: GET
        path: /api/users/1
      expect:
        status: 200
    - name: create-user
      weight: 1
      request:
        method: POST
        path: /api/users
        json:
          name: Test User
          email: fixture@example.test
      fixtures:
        - { name: Fixture A, email: a@example.test }
        - { name: Fixture B, email: b@example.test }
      expect:
        status: 201
traffic:
  requests_per_day: 20000
budgets:
  worker:
    max_external_subrequests_per_request: 30
  d1:
    max_rows_read_per_request: 500
    max_projected_rows_read_per_day: 4000000
  kv:
    max_projected_writes_per_day: 800
policy:
  fail_on: critical
  missing_measurements: warn
reporting:
  formats: [terminal, json, markdown]
